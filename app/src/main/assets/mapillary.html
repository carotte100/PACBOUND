<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #pano {
            width: 100%;
            height: 100%;
        }

        #message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
            background: #000;
        }
    </style>
</head>
<body>
<div id="pano"></div>
<div id="message">Chargement...</div>

<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script>
    var viewer = null;

    function showMessage(text) {
        var el = document.getElementById('message');
        el.textContent = text || '';
        el.style.display = text ? 'flex' : 'none';
    }

    // Cherche la photo Mapillary la plus proche d'un point, dans un carre d'environ 150 m.
    function findNearestImageId(token, lat, lon) {
        var d = 0.0015;
        var bbox = [lon - d, lat - d, lon + d, lat + d].join(',');
        var url = 'https://graph.mapillary.com/images'
            + '?access_token=' + encodeURIComponent(token)
            + '&fields=id&limit=1&bbox=' + bbox;

        return fetch(url).then(function (response) {
            if (!response.ok) {
                throw new Error('API Mapillary ' + response.status);
            }
            return response.json();
        }).then(function (body) {
            return body.data && body.data.length ? body.data[0].id : null;
        });
    }

    function startViewer(token, lat, lon) {
        if (!token) {
            showMessage('Token Mapillary manquant.\nAjoute MAPILLARY_TOKEN dans local.properties puis relance.');
            return;
        }

        findNearestImageId(token, lat, lon).then(function (imageId) {
            if (!imageId) {
                showMessage('Aucune photo Mapillary a cet endroit.');
                return;
            }
            viewer = new mapillary.Viewer({
                accessToken: token,
                container: 'pano',
                imageId: imageId
            });
            showMessage('');
        }).catch(function (error) {
            showMessage('Erreur : ' + error.message);
        });
    }
</script>
</body>
</html>
